<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osirion - Surveillance Streams</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00adb5;
        }

        #status {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-weight: bold;
        }

        #status.connected {
            background: #28a745;
            color: white;
        }

        #status.disconnected {
            background: #dc3545;
            color: white;
        }

        #cameras-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .camera-card {
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .camera-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .camera-name {
            font-size: 18px;
            font-weight: bold;
            color: #00adb5;
        }

        .camera-location {
            font-size: 14px;
            color: #aaa;
        }

        .stream-button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .stream-button.start {
            background: #28a745;
            color: white;
        }

        .stream-button.start:hover {
            background: #218838;
        }

        .stream-button.stop {
            background: #dc3545;
            color: white;
        }

        .stream-button.stop:hover {
            background: #c82333;
        }

        .stream-button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .no-stream {
            padding: 100px 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .stream-info {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }

        .fps-counter {
            color: #00adb5;
            font-weight: bold;
        }

        #logs {
            background: #0f0f0f;
            padding: 15px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-info { color: #00adb5; }
        .log-error { color: #dc3545; }
        .log-success { color: #28a745; }
    </style>
</head>
<body>
    <h1>🎥 Osirion - Surveillance en Temps Réel</h1>
    
    <div id="status" class="disconnected">
        🔴 Déconnecté
    </div>

    <div id="cameras-container"></div>

    <h2 style="margin-top: 30px; margin-bottom: 10px;">📊 Logs</h2>
    <div id="logs"></div>

    <script>
        // Configuration
        const WEBSOCKET_URL = 'http://localhost:5000';
        
        // État global
        let socket = null;
        let cameras = [];
        let activeStreams = {};  // {camera_id: {canvas, ctx, fps, lastFrameTime}}

        // Connexion WebSocket
        function connectWebSocket() {
            log('Connexion au serveur WebSocket...', 'info');
            
            socket = io(WEBSOCKET_URL, {
                transports: ['websocket', 'polling']
            });

            // Événement: Connexion établie
            socket.on('connect', () => {
                log('✅ Connecté au serveur !', 'success');
                updateStatus(true);
            });

            // Événement: Déconnexion
            socket.on('disconnect', () => {
                log('❌ Déconnecté du serveur', 'error');
                updateStatus(false);
            });

            // Événement: Liste des caméras reçue
            socket.on('cameras_list', (data) => {
                log(`📷 ${data.cameras.length} caméra(s) disponible(s)`, 'info');
                cameras = data.cameras;
                renderCameras();
            });

            // Événement: Stream démarré
            socket.on('stream_started', (data) => {
                log(`▶️ Stream démarré pour caméra ${data.camera_id}`, 'success');
            });

            // Événement: Stream arrêté
            socket.on('stream_stopped', () => {
                log(`⏸️ Stream arrêté`, 'info');
            });

            // Événement: Frame reçue
            socket.on('frame', (data) => {
                displayFrame(data);
            });

            // Événement: Erreur
            socket.on('error', (data) => {
                log(`⚠️ Erreur: ${data.message}`, 'error');
                alert(`Erreur: ${data.message}`);
            });
        }

        // Afficher une frame
        function displayFrame(frameData) {
            const { camera_id, data, timestamp } = frameData;
            
            if (!activeStreams[camera_id]) return;

            const stream = activeStreams[camera_id];
            const img = new Image();

            img.onload = () => {
                // Dimensionner le canvas à la première frame
                if (stream.canvas.width === 0) {
                    stream.canvas.width = img.width;
                    stream.canvas.height = img.height;
                }

                // Dessiner la frame
                stream.ctx.drawImage(img, 0, 0);

                // Calculer FPS
                const now = performance.now();
                if (stream.lastFrameTime) {
                    const elapsed = now - stream.lastFrameTime;
                    stream.fps = Math.round(1000 / elapsed);
                }
                stream.lastFrameTime = now;

                // Mettre à jour l'affichage FPS
                updateStreamInfo(camera_id);
            };

            img.src = 'data:image/jpeg;base64,' + data;
        }

        // Démarrer un stream
        function startStream(cameraId) {
            if (activeStreams[cameraId]) {
                log(`⚠️ Stream déjà actif pour caméra ${cameraId}`, 'info');
                return;
            }

            log(`🎬 Demande de stream pour caméra ${cameraId}...`, 'info');

            // Créer le canvas
            const canvas = document.getElementById(`canvas-${cameraId}`);
            const ctx = canvas.getContext('2d');

            activeStreams[cameraId] = {
                canvas,
                ctx,
                fps: 0,
                lastFrameTime: null
            };

            // Supprimer le message "Pas de stream"
            const noStreamDiv = document.getElementById(`no-stream-${cameraId}`);
            if (noStreamDiv) noStreamDiv.remove();

            // Afficher le canvas
            canvas.style.display = 'block';

            // Envoyer la demande au serveur
            socket.emit('start_stream', { camera_id: cameraId });

            // Mettre à jour le bouton
            updateButtonState(cameraId, true);
        }

        // Arrêter un stream
        function stopStream(cameraId) {
            if (!activeStreams[cameraId]) {
                log(`⚠️ Aucun stream actif pour caméra ${cameraId}`, 'info');
                return;
            }

            log(`⏹️ Arrêt du stream pour caméra ${cameraId}...`, 'info');

            // Nettoyer le canvas
            const stream = activeStreams[cameraId];
            stream.ctx.clearRect(0, 0, stream.canvas.width, stream.canvas.height);
            stream.canvas.style.display = 'none';

            // Supprimer de l'état
            delete activeStreams[cameraId];

            // Afficher le message "Pas de stream"
            const videoContainer = document.getElementById(`video-${cameraId}`);
            const noStreamDiv = document.createElement('div');
            noStreamDiv.id = `no-stream-${cameraId}`;
            noStreamDiv.className = 'no-stream';
            noStreamDiv.textContent = 'Aucun stream actif';
            videoContainer.appendChild(noStreamDiv);

            // Envoyer la demande au serveur
            socket.emit('stop_stream');

            // Mettre à jour le bouton
            updateButtonState(cameraId, false);
        }

        // Mettre à jour l'état du bouton
        function updateButtonState(cameraId, isStreaming) {
            const button = document.getElementById(`btn-${cameraId}`);
            if (isStreaming) {
                button.textContent = '⏹️ Arrêter';
                button.className = 'stream-button stop';
                button.onclick = () => stopStream(cameraId);
            } else {
                button.textContent = '▶️ Démarrer';
                button.className = 'stream-button start';
                button.onclick = () => startStream(cameraId);
            }
        }

        // Mettre à jour les infos du stream
        function updateStreamInfo(cameraId) {
            const infoDiv = document.getElementById(`info-${cameraId}`);
            if (infoDiv && activeStreams[cameraId]) {
                const fps = activeStreams[cameraId].fps;
                infoDiv.innerHTML = `<span class="fps-counter">${fps} FPS</span> | Latence: ~200ms`;
            }
        }

        // Afficher les caméras
        function renderCameras() {
            const container = document.getElementById('cameras-container');
            container.innerHTML = '';

            cameras.forEach(cam => {
                const card = document.createElement('div');
                card.className = 'camera-card';
                card.innerHTML = `
                    <div class="camera-header">
                        <div>
                            <div class="camera-name">${cam.name}</div>
                            <div class="camera-location">📍 ${cam.location}</div>
                        </div>
                        <button id="btn-${cam.id}" class="stream-button start" onclick="startStream(${cam.id})">
                            ▶️ Démarrer
                        </button>
                    </div>
                    <div class="video-container" id="video-${cam.id}">
                        <canvas id="canvas-${cam.id}" style="display: none;"></canvas>
                        <div id="no-stream-${cam.id}" class="no-stream">Aucun stream actif</div>
                    </div>
                    <div class="stream-info" id="info-${cam.id}">
                        En attente...
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Mettre à jour le statut de connexion
        function updateStatus(isConnected) {
            const statusDiv = document.getElementById('status');
            if (isConnected) {
                statusDiv.textContent = '🟢 Connecté';
                statusDiv.className = 'status connected';
            } else {
                statusDiv.textContent = '🔴 Déconnecté';
                statusDiv.className = 'status disconnected';
            }
        }

        // Ajouter un log
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;

            // Limiter à 50 logs
            if (logsDiv.children.length > 50) {
                logsDiv.removeChild(logsDiv.firstChild);
            }
        }

        // Initialisation
        window.onload = () => {
            log('Application démarrée', 'info');
            connectWebSocket();
        };

        // Nettoyage à la fermeture
        window.onbeforeunload = () => {
            Object.keys(activeStreams).forEach(cameraId => {
                stopStream(parseInt(cameraId));
            });
        };
    </script>
</body>
</html>
