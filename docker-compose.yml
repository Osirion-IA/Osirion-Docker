# =============================================================================
# Osirion — docker-compose GLOBAL (GPU)
# =============================================================================
# Orchestre les 4 services : db → backend → core → frontend
# Tous les services partagent le réseau "osirion".
#
# Pré-requis :
#   - nvidia-container-toolkit installé sur l'hôte
#   - cp .env.example .env  puis remplir les valeurs
#
# Usage :
#   docker compose up -d          → démarrage en arrière-plan
#   docker compose logs -f        → suivre les logs
#   docker compose down           → arrêt
#   docker compose down -v        → arrêt + suppression des volumes
#
# Si les images ne sont pas encore construites :
#   python build_images.py
#
# Bind mounts (synchronisation du code local → conteneur, sans rebuild) :
#   Backend : ./Osirion-backend-main/Osirion-backend-main/app  → /app/app
#             ./Osirion-backend-main/Osirion-backend-main/scripts → /app/scripts
#             ./Osirion-backend-main/Osirion-backend-main/alembic → /app/alembic
#   Core    : ./Osirion-core-master/Osirion-core-master/config  → /app/config
#             (+ core/, services/, utils/, face_detection*.py)
#   yolov11n-face.pt reste dans l'image (non écrasé). Le tracker OC-SORT vit
#   dans core/ (donc bind-monté et hot-reloadable).
# =============================================================================

networks:
  osirion:
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  # Base de données — PostgreSQL 15 + extension pgvector
  # ---------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg15
    container_name: osirion-db
    restart: unless-stopped
    networks:
      - osirion
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-Osirion-AI}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Backend — FastAPI (build CPU : torch CPU + onnxruntime CPU)
  # L'inférence faciale du backend utilise CPUExecutionProvider (cf. code) :
  # il n'a PAS besoin du GPU. Build CPU → image ~4 Go au lieu de ~14 Go, et le
  # GPU reste entièrement disponible pour le Core (temps réel).
  # L'entrypoint attend la DB, applique les migrations, puis lance uvicorn.
  #
  # Bind mounts granulaires : seuls app/, scripts/ et alembic/ sont écrasés.
  # Hot-reload uvicorn activé via UVICORN_RELOAD=true (entrypoint.py).
  # ---------------------------------------------------------------------------
  backend:
    image: osirion-backend:cpu
    build:
      context: ./Osirion-backend-main/Osirion-backend-main
      args:
        GPU: "0"
    container_name: osirion-backend
    restart: unless-stopped
    networks:
      - osirion
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-Osirion-AI}
      SECRET_KEY: ${SECRET_KEY}
      FERNET_KEY: ${FERNET_KEY}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000"]}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-5/minute}
      RATE_LIMIT_GENERAL: ${RATE_LIMIT_GENERAL:-100/minute}
      ADMIN_EMAIL: ${AUTH_EMAIL:-admin@osirion.app}
      ADMIN_PASSWORD: ${AUTH_PASSWORD:-adminadminadmin}
      CUDA_VISIBLE_DEVICES: "0"
      UVICORN_RELOAD: "true"
      # ── Qualité de l'enrôlement facial (garde-fous, tunables) ───────────────
      # NE PAS mettre plus strict que la reconnaissance en production (Core=0.7).
      # Netteté mesurée sur le CROP du visage (pas la frame entière) → un portrait
      # à fond flou/bokeh n'est plus rejeté à tort. 0 = filtre netteté désactivé.
      ENROLL_FACE_MIN_CONFIDENCE: ${ENROLL_FACE_MIN_CONFIDENCE:-0.6}
      ENROLL_FACE_CROP_MIN_SHARPNESS: ${ENROLL_FACE_CROP_MIN_SHARPNESS:-25.0}
      # ── Notifications d'alerte (SMTP/webhook) — valeurs dans .env (non versionné)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-osirion@localhost}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      # ── Bind mounts — code local écrase le code de l'image ──────────────────
      - ./Osirion-backend-main/Osirion-backend-main/app:/app/app
      - ./Osirion-backend-main/Osirion-backend-main/scripts:/app/scripts
      - ./Osirion-backend-main/Osirion-backend-main/alembic:/app/alembic
      # ── Named volumes — données persistantes (non écrasées par le bind mount)
      - uploads_data:/app/uploads
      - cropped_data:/app/cropped
      - snapshots_data:/app/snapshots
      - insightface_cache:/root/.insightface
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
    # Pas de réservation GPU : backend en CPU (le GPU est dédié au Core).

  # ---------------------------------------------------------------------------
  # Core — Flask + GPU (surveillance multi-caméras, détection, tracking)
  # Se connecte au backend via le réseau interne Docker (http://backend:8000).
  #
  # Bind mounts granulaires : seuls les packages Python modifiés sont écrasés.
  # yolov11n-face.pt reste dans l'image (le tracker OC-SORT vit dans core/, bind-monté).
  # Pas d'auto-reload (risque de coupure des flux RTSP) — faire :
  #   docker restart osirion-core   après modification du code.
  # ---------------------------------------------------------------------------
  core:
    image: osirion-core:gpu
    build:
      context: ./Osirion-core-master/Osirion-core-master
      args:
        GPU: "1"
    container_name: osirion-core
    restart: unless-stopped
    # MediaMTX étant en network_mode: host, le Core (sur le bridge) l'atteint via
    # la passerelle Docker → mappe host.docker.internal vers host-gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - osirion
    depends_on:
      backend:
        condition: service_healthy
      mediamtx:
        condition: service_started   # le Core lit le flux republié par MediaMTX
    ports:
      - "5000:5000"
    environment:
      # URL interne Docker vers le backend — NE PAS utiliser localhost ici
      API_URL: http://backend:8000/
      # ── Source vidéo (VMS Phase 2) : le Core lit le flux RTSP republié par
      # MediaMTX (rtsp://mediamtx:8554/cam<id>) → UNE seule connexion à la caméra
      # physique (MediaMTX), partagée entre l'IA (Core) et la vidéo (WebRTC).
      READ_FROM_MEDIAMTX: "true"
      # MediaMTX tourne en network_mode: host (cf. service mediamtx) → on l'atteint
      # via l'hôte (host.docker.internal = passerelle Docker), plus par le DNS
      # interne 'mediamtx' qui n'existe plus sur le bridge.
      MEDIAMTX_RTSP_BASE: host.docker.internal:8554
      # API MediaMTX : le Core y déclare/supprime à chaud 1 chemin par caméra
      # (cf. services.mediamtx_path_service).
      MEDIAMTX_API_BASE: http://host.docker.internal:9997
      AUTH_EMAIL: ${AUTH_EMAIL}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      # Mode de sécurité : development (CORS ouvert) | production (CORS strict).
      OSIRION_ENV: ${OSIRION_ENV:-development}
      # En dev, laisser vide → toute origine acceptée. En prod, lister les domaines HTTPS.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: logs
      CUDA_VISIBLE_DEVICES: "0"
      # ── Événement « visage non reconnu » (UNKNOWN_FACE) ─────────────────────
      # OPT-IN : false par défaut. Activable à chaud via le frontend (toggle) ou
      # en mettant true ici. Enregistre un événement distinct pour tout visage
      # détecté mais non identifié (person_id NULL). N'affecte pas le facial.
      ENABLE_UNKNOWN_FACE_EVENT: ${ENABLE_UNKNOWN_FACE_EVENT:-false}
      # ── Précision faciale (garde-fou taille + vote temporel) — défauts sûrs ──
      FACE_MIN_RECOG_SIZE: ${FACE_MIN_RECOG_SIZE:-40}          # visage <40px → pas de reco (0=off)
      FACE_TEMPORAL_VOTING: ${FACE_TEMPORAL_VOTING:-true}      # vote identité multi-frames
      FACE_VOTE_MIN_AGREE: ${FACE_VOTE_MIN_AGREE:-2}           # accords requis avant confirmation
      FACE_VOTE_MAX_ATTEMPTS: ${FACE_VOTE_MAX_ATTEMPTS:-5}     # tentatives max avant « Inconnu »
      # ── Recherche d'embeddings LOCALE (réplique FAISS dans le Core) ──────────
      # Défaut : true → recherche FAISS en RAM dans le Core (latence ~0.1 ms vs
      # ~5-15 ms en HTTP) + décharge le backend de N requêtes de reconnaissance/s.
      # Mettre false pour revenir à la recherche via HTTP backend. PostgreSQL reste
      # géré uniquement par le backend ; le Core ne garde qu'une copie lecture seule,
      # rechargée au démarrage + poll de version. Repli HTTP automatique si l'index
      # local n'est pas prêt (aucune régression possible).
      FAISS_LOCAL: ${FAISS_LOCAL:-true}
      FAISS_LOCAL_RECONCILE_SECONDS: ${FAISS_LOCAL_RECONCILE_SECONDS:-15}
      # ── MESURE (évaluation chapitre 4 du mémoire) ───────────────────────────
      # Journalise latence/débit/cache/GPU + décisions reco
      # dans /app/measurements/metrics.jsonl (bind mount → ./measurements sur l'hôte),
      # dépouillé hors-ligne par tools/analyze_metrics.py. MEASURE_ENABLED=false → no-op.
      MEASURE_ENABLED: ${MEASURE_ENABLED:-true}
      MEASURE_FILE: /app/measurements/metrics.jsonl
      MEASURE_SAMPLE_SECONDS: ${MEASURE_SAMPLE_SECONDS:-5}
    volumes:
      # ── Bind mounts — packages Python modifiés ──────────────────────────────
      # Le tracker OC-SORT vit dans core/ (bind-monté → hot-reload du code).
      # yolov11n-face.pt reste dans l'image.
      - ./Osirion-core-master/Osirion-core-master/config:/app/config
      - ./Osirion-core-master/Osirion-core-master/core:/app/core
      - ./Osirion-core-master/Osirion-core-master/services:/app/services
      - ./Osirion-core-master/Osirion-core-master/utils:/app/utils
      - ./Osirion-core-master/Osirion-core-master/face_detection.py:/app/face_detection.py
      - ./Osirion-core-master/Osirion-core-master/face_detection_new.py:/app/face_detection_new.py
      - ./Osirion-core-master/Osirion-core-master/main_refactored.py:/app/main_refactored.py
      # ── Named volume — logs persistants ────────────────────────────────────
      - core_logs:/app/logs
      # ── Mesure (chapitre 4) — journal metrics.jsonl directement sur l'hôte ──
      - ./measurements:/app/measurements
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/api/cameras"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # MediaMTX — proxy média (RTSP ingest → WebRTC/WHEP)   [Phase 2]
  # Décharge TOTALEMENT le transport vidéo du Core : le frontend lit la vidéo en
  # WebRTC natif (décodage accéléré matériellement par le navigateur) et superpose
  # les bounding boxes reçues en JSON via Socket.IO. Configuration : ./mediamtx.yml.
  # Les chemins caméra (cam<id>) ne sont PLUS injectés ici : le Core les crée à
  # chaud via l'API MediaMTX (source = rtsp_url backend).
  # ---------------------------------------------------------------------------
  mediamtx:
    # Variante -ffmpeg : ffmpeg est embarqué dans l'image. Indispensable car le
    # Core configure chaque chemin caméra en relais FFmpeg (runOnDemand) — voir
    # services.mediamtx_path_service — pour ingérer les caméras dont le H264
    # n'est pas en packetization-mode 1 (refusé par l'ingest RTSP natif).
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: osirion-mediamtx
    restart: unless-stopped
    # network_mode: host → MediaMTX se lie DIRECTEMENT aux interfaces de l'hôte.
    # Indispensable pour le WebRTC : derrière le NAT bridge Docker, l'ICE UDP ne
    # s'établit pas pour les postes du LAN (« deadline exceeded while waiting
    # connection ») — le chemin retour est cassé et MediaMTX ne voit pas les vraies
    # adresses. En réseau hôte, il découvre les vraies IP (dont l'IP LAN) et l'ICE
    # marche nativement, sans mapping de ports ni webrtcAdditionalHosts.
    # Ports directement sur l'hôte : 8554 (RTSP), 8889 (WHEP), 8189 (ICE udp+tcp),
    # 9997 (API — désormais joignable sur le LAN ; à restreindre en production).
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      # Logs debug persistants sur l'hôte (capture de repro hors-ligne)
      - ./logs-mediamtx:/logs

  # ---------------------------------------------------------------------------
  # Frontend — Next.js standalone (~200 MB)
  # Les appels API serveur passent par le réseau interne Docker.
  # Vidéo : WebRTC (WHEP) navigateur → MediaMTX (port 8889 publié).
  # Overlay : événement Socket.IO 'metadata' navigateur → Core (port 5000 publié).
  # ---------------------------------------------------------------------------
  frontend:
    image: osirion-frontend:latest
    build:
      context: ./Osirion-front-end-main/Osirion-front-end-main
    container_name: osirion-frontend
    restart: unless-stopped
    networks:
      - osirion
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Mode de sécurité (pilote le flag Secure des cookies d'auth) :
      #   development → cookies non-Secure (HTTP LAN OK)  |  production → Secure (HTTPS).
      OSIRION_ENV: ${OSIRION_ENV:-development}
      # Override optionnel : COOKIE_SECURE=true|false force le flag ; vide → suit OSIRION_ENV.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # URL interne (server-side Next.js → backend dans Docker)
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_BASE_BACKEND_URL: http://backend:8000
      # URL publique (navigateur → core WebSocket, accessible depuis l'hôte)
      NEXT_PUBLIC_CORE_URL: http://localhost:5000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      # Socket.IO Core (overlay metadata) + MediaMTX WHEP (vidéo WebRTC) — Phase 2
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
      NEXT_PUBLIC_MEDIAMTX_URL: http://localhost:8889
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  db_data:
  uploads_data:
  cropped_data:
  snapshots_data:
  insightface_cache:
  core_logs:
