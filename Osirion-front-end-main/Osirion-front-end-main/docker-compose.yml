# =============================================================================
# Osirion-Frontend — docker-compose
# =============================================================================
# Usage :
#   docker compose up [-d]
#
# Avant le premier lancement :
#   cp .env.example .env   # puis remplir les valeurs
# =============================================================================

networks:
  osirion-frontend:
    driver: bridge

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: osirion-frontend:latest
    container_name: osirion-frontend
    restart: unless-stopped
    networks:
      - osirion-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
